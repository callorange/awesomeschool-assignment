schema: spec-driven

context: |
  Language: Korean
  All artifacts must be written in Korean.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  프로젝트는 교육 소개, 신청 접수, 신청 관리를 제공하는 어썸스쿨 개발 과제다.
  공유 거버넌스의 진입점은 docs/README.md다. 작업에 관련된 주제별 규약을 읽고 적용한다.
  구조·기술 선택은 docs/architecture.md, 개발·검증·Git 정책은 docs/development.md를 따른다.
  실행 방법·현재 구현 상태·MVP와 후속 범위는 README.md, 과제 원문은 docs/awesomeschool-assignment.md를 따른다.

rules:
  proposal:
    - 현재 change 범위와 제외 범위, MVP 이후 예정 사항을 구분한다.
  design:
    - 변경에 관련된 데이터·개인정보·권한 경계와 기술 선택 이유를 설명한다.
  tasks:
    - 각 작업에 관찰 가능한 검증 방법을 포함하고 필요한 테스트·문서를 해당 작업과 함께 처리한다.

operations:
  apply:
    guidance:
      - 관련 검사의 실제 결과를 확인한 뒤 완료 표시하고, 환경 문제와 코드 오류 및 미검증 범위를 구분한다.
