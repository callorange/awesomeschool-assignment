[project]
name = "awesomeschool-assignment"
version = "0.1.0"
description = "어썸스쿨 교육 신청 시스템 개발 과제"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django==6.1.2",
    "django-environ>=0.14,<0.15",
    "djangorestframework>=3.16,<4",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
include = ["src/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10
