{% if form.non_field_errors %}<div role="alert" class="rounded-lg bg-red-50 p-4 text-sm text-red-800">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
  <div class="min-w-0">
    <label for="{{ field.id_for_label }}" class="mb-2 block text-sm font-semibold">{{ field.label }}{% if field.field.required %}<span class="ml-1 text-clay" aria-label="필수">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p class="mt-1 text-xs text-ink/65">{{ field.help_text }}</p>{% endif %}
    {% if field.errors %}<div id="{{ field.auto_id }}_error" role="alert" class="mt-2 text-sm text-red-800">{{ field.errors }}</div>{% endif %}
  </div>
{% endfor %}
