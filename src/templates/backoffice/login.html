{% extends 'backoffice/base.html' %}
{% block title %}관리자 로그인{% endblock %}
{% block content %}
  <section class="mx-auto my-10 max-w-md rounded-2xl border border-ink/10 bg-white p-6 shadow-sm md:my-20 md:p-10">
    <p class="text-xs font-bold tracking-widest text-clay">AWESOMESCHOOL · BACKOFFICE</p>
    <h1 class="mt-4 text-3xl font-black">관리자 로그인</h1>
    <p class="mt-3 text-sm leading-6 text-ink/65">기존 Django 관리자 계정으로 로그인하세요.<br>두 관리자 화면은 로그인·로그아웃 상태를 공유합니다.</p>
    <form method="post" class="mt-8 space-y-5 [&_input:not([type=hidden])]:min-h-12 [&_input:not([type=hidden])]:w-full [&_input:not([type=hidden])]:rounded-lg [&_input:not([type=hidden])]:border [&_input:not([type=hidden])]:border-ink/25 [&_input:not([type=hidden])]:px-3 [&_input:focus]:outline-2 [&_input:focus]:outline-clay">
      {% csrf_token %}
      {% include 'backoffice/fields.html' %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="min-h-12 w-full cursor-pointer rounded-lg bg-ink px-5 py-3 font-bold text-white">로그인</button>
    </form>
  </section>
{% endblock %}
