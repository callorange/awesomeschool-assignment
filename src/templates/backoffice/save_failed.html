{% extends 'backoffice/base.html' %}

{% block content %}

    <p class="mt-4 leading-7">저장 처리 중 오류가 발생했습니다. 신청 상세에서 현재 결과를 확인한 뒤 다시 시도해 주세요. 자동으로 다시 제출하지 않습니다.</p>
    <a href="{% url 'backoffice:application-list' %}" class="mt-6 inline-flex min-h-12 items-center rounded-lg bg-ink px-5 font-bold text-white">신청 목록으로 이동</a>
  </section>
